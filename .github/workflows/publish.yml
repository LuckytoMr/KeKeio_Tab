name: Verify and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kekeio-tab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kekeio-tab
  NODE_VERSION: '24'

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Activate pnpm 11.6.0
        run: |
          corepack enable
          corepack install --global pnpm@11.6.0

      - name: Install admin dependencies
        run: pnpm --dir backend/admin-ui install --frozen-lockfile

      - name: Install extension dependencies
        run: pnpm --dir extension install --frozen-lockfile

      - name: Test and build admin UI
        run: |
          pnpm --dir backend/admin-ui test
          pnpm --dir backend/admin-ui build

      - name: Test and build extension
        run: |
          pnpm --dir extension test
          pnpm --dir extension typecheck
          pnpm --dir extension build

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test and vet backend
        working-directory: backend
        run: |
          go test ./... -count=1
          go vet ./...

  package:
    name: Build release archives
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Activate pnpm 11.6.0
        run: |
          corepack enable
          corepack install --global pnpm@11.6.0

      - name: Build embedded admin UI and extension
        run: |
          pnpm --dir backend/admin-ui install --frozen-lockfile
          pnpm --dir backend/admin-ui build
          pnpm --dir extension install --frozen-lockfile
          pnpm --dir extension build

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build Windows and Linux ARM64 server binaries
        working-directory: backend
        run: |
          mkdir -p bin
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o bin/fullpro-server.exe ./cmd/fullpro-server
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o bin/fullpro-server-linux-arm64 ./cmd/fullpro-server

      - name: Set up QEMU for offline ARM64 image
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Buildx for offline ARM64 image
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build offline ARM64 Docker archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          tags: kekeio-tab:arm64
          outputs: type=docker,dest=${{ runner.temp }}/kekeio-tab-docker-arm64.tar

      - name: Verify offline ARM64 Docker archive
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/kekeio-tab-docker-arm64.tar"
          test -s "${archive}"
          docker load -i "${archive}"
          test "$(docker image inspect kekeio-tab:arm64 --format '{{.Os}}/{{.Architecture}}')" = "linux/arm64"

          container_name="kekeio-tab-offline-verify"
          cleanup() {
            docker rm -f "${container_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name "${container_name}" \
            --platform linux/arm64 \
            -p 127.0.0.1:9009:9009 \
            kekeio-tab:arm64

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:9009/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs "${container_name}"
          exit 1

      - name: Create release archives
        run: |
          mkdir -p release
          mv "${RUNNER_TEMP}/kekeio-tab-docker-arm64.tar" release/kekeio-tab-docker-arm64.tar
          cd backend
          zip -qr ../release/kekeio-tab-backend.zip cmd internal admin-ui bin deploy Dockerfile .dockerignore .env.example go.mod go.sum README.md \
            -x 'admin-ui/node_modules/*' 'admin-ui/dist/*' 'admin-ui/coverage/*'
          cd ../extension
          zip -qr ../release/kekeio-tab-extension.zip dist

      - name: Upload release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kekeio-tab-release
          path: |
            release/*.zip
            release/*.tar
          if-no-files-found: error
          retention-days: 14

  publish-image:
    name: Publish GHCR image
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kekeio-tab-release
          path: release

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/*.zip release/*.tar --generate-notes --title "KeKeIO Tab ${GITHUB_REF_NAME}"
