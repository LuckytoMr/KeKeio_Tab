name: Verify and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kekeio-tab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  DOCKER_BUILD_SUMMARY: 'false'

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Activate pnpm 11.6.0
        run: |
          corepack enable
          corepack install --global pnpm@11.6.0

      - name: Install admin dependencies
        run: pnpm --dir backend/admin-ui install --frozen-lockfile

      - name: Install extension dependencies
        run: pnpm --dir extension install --frozen-lockfile

      - name: Test and build admin UI
        run: |
          pnpm --dir backend/admin-ui test
          pnpm --dir backend/admin-ui build

      - name: Test and build extension
        run: |
          pnpm --dir extension test
          pnpm --dir extension typecheck
          pnpm --dir extension build

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test and vet backend
        working-directory: backend
        run: |
          go test ./... -count=1
          go vet ./...

      - name: Check reachable Go vulnerabilities
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: Verify deployment scripts
        run: |
          sh -n backend/docker-entrypoint.sh
          sh -n backend/deploy/router/install.sh
          sh backend/deploy/router/install.sh --self-test

      - name: Verify fixed product and security baseline
        shell: pwsh
        run: ./scripts/verify-security-baseline.ps1

  package:
    name: Build and publish two release files
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Activate pnpm 11.6.0
        run: |
          corepack enable
          corepack install --global pnpm@11.6.0

      - name: Build browser extension ZIP
        run: |
          pnpm --dir extension install --frozen-lockfile
          pnpm --dir extension build
          mkdir -p release
          (cd extension && zip -qr ../release/kekeio-tab-extension.zip dist)
          test -s release/kekeio-tab-extension.zip

      - name: Set up QEMU for offline ARM64 image
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Buildx for offline ARM64 image
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build offline ARM64 Docker archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          tags: kekeio-tab:arm64
          outputs: type=docker,dest=${{ runner.temp }}/kekeio-tab-app-arm64.tar

      - name: Assemble and verify offline ARM64 Docker archive
        shell: bash
        run: |
          set -euo pipefail
          app_archive="${RUNNER_TEMP}/kekeio-tab-app-arm64.tar"
          archive="${RUNNER_TEMP}/kekeio-tab-docker-arm64.tar"
          test -s "${app_archive}"
          docker load -i "${app_archive}"
          docker pull --platform linux/arm64 cloudflare/cloudflared:latest
          test "$(docker image inspect kekeio-tab:arm64 --format '{{.Os}}/{{.Architecture}}')" = "linux/arm64"
          test "$(docker image inspect cloudflare/cloudflared:latest --format '{{.Os}}/{{.Architecture}}')" = "linux/arm64"

          docker save \
            --output "${archive}" \
            kekeio-tab:arm64 \
            cloudflare/cloudflared:latest
          test -s "${archive}"
          docker image rm kekeio-tab:arm64 cloudflare/cloudflared:latest >/dev/null
          docker load -i "${archive}"
          test "$(docker image inspect kekeio-tab:arm64 --format '{{.Os}}/{{.Architecture}}')" = "linux/arm64"
          test "$(docker image inspect cloudflare/cloudflared:latest --format '{{.Os}}/{{.Architecture}}')" = "linux/arm64"

          container_name="kekeio-tab-offline-verify"
          bind_root="${RUNNER_TEMP}/kekeio-tab-offline-bind"
          bridge_gateway="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          mkdir -p "${bind_root}"
          cleanup() {
            docker rm -f -v "${container_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name "${container_name}" \
            --platform linux/arm64 \
            -e "FULLPRO_ADMIN_ALLOWED_CIDRS=127.0.0.1/32,${bridge_gateway}/32" \
            -e FULLPRO_COOKIE_SECURE=false \
            -e FULLPRO_ALLOW_INSECURE_ADMIN_HTTP=true \
            -v "${bind_root}/data:/data" \
            -v "${bind_root}/backups:/backups" \
            -p 127.0.0.1:9009:9009 \
            kekeio-tab:arm64

          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:9009/health/live >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [[ "${healthy}" != true ]]; then
            docker logs "${container_name}"
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:9009/install >/dev/null
          test -s "${bind_root}/data/fullpro.db"
          test "$(stat -c '%u:%g' "${bind_root}/data")" = "10001:10001"
          test "$(stat -c '%u:%g' "${bind_root}/backups")" = "10001:10001"
          test "$(docker exec "${container_name}" sh -c "awk '/^Uid:/{print \$2}' /proc/1/status")" = "10001"
          docker run --rm \
            --platform linux/arm64 \
            --network "container:${container_name}" \
            cloudflare/cloudflared:latest \
            --version

      - name: Create release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          mv "${RUNNER_TEMP}/kekeio-tab-docker-arm64.tar" release/kekeio-tab-docker-arm64.tar
          test -s release/kekeio-tab-docker-arm64.tar
          test -s release/kekeio-tab-extension.zip
          mapfile -t release_files < <(find release -maxdepth 1 -type f -printf '%f\n' | sort)
          expected_files=(kekeio-tab-docker-arm64.tar kekeio-tab-extension.zip)
          test "${release_files[*]}" = "${expected_files[*]}"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            release/kekeio-tab-extension.zip
            release/kekeio-tab-docker-arm64.tar
          )

          clean_release_assets() {
            local release_tag="$1"
            while IFS= read -r asset_name; do
              case "${asset_name}" in
                kekeio-tab-extension.zip|kekeio-tab-docker-arm64.tar) ;;
                *) gh release delete-asset "${release_tag}" "${asset_name}" -y ;;
              esac
            done < <(gh release view "${release_tag}" --json assets --jq '.assets[].name')
          }

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_tag="${GITHUB_REF_NAME}"
            if gh release view "${release_tag}" >/dev/null 2>&1; then
              clean_release_assets "${release_tag}"
              gh release upload "${release_tag}" "${assets[@]}" --clobber
            else
              gh release create "${release_tag}" "${assets[@]}" --generate-notes --title "KeKeIO Tab ${release_tag}"
            fi
          else
            release_tag="main-latest"
            release_title="KeKeIO Tab main 最新构建 (${GITHUB_SHA:0:7})"
            release_notes="由 main 分支 ${GITHUB_SHA} 自动构建。每次 main 构建成功后覆盖，下载文件不占用 Actions Artifact 配额。"
            if gh release view "${release_tag}" >/dev/null 2>&1; then
              gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/git/refs/tags/${release_tag}" \
                -f "sha=${GITHUB_SHA}" -F force=true >/dev/null
              clean_release_assets "${release_tag}"
              gh release upload "${release_tag}" "${assets[@]}" --clobber
              gh release edit "${release_tag}" --prerelease --title "${release_title}" --notes "${release_notes}"
            else
              gh release create "${release_tag}" "${assets[@]}" \
                --target "${GITHUB_SHA}" --prerelease \
                --title "${release_title}" --notes "${release_notes}"
            fi
          fi

          mapfile -t published_assets < <(gh release view "${release_tag}" --json assets --jq '.assets[].name' | sort)
          expected_assets=(kekeio-tab-docker-arm64.tar kekeio-tab-extension.zip)
          if [[ "${published_assets[*]}" != "${expected_assets[*]}" ]]; then
            printf '发布资产不符合固定清单：%s\n' "${published_assets[*]}" >&2
            exit 1
          fi

          download_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}"
          {
            echo "## 下载本次构建"
            echo
            echo "- [浏览器扩展 ZIP](${download_base}/kekeio-tab-extension.zip)"
            echo "- [ARM64 Docker 镜像 tar](${download_base}/kekeio-tab-docker-arm64.tar)"
            echo
            echo "固定只发布以上两个自定义文件，不使用 Actions Artifact 配额。"
          } >> "${GITHUB_STEP_SUMMARY}"
