name: 功能建议
description: 提议范围清晰、可验证的改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述使用场景和当前阻碍，不要只给出界面方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: dropdown
    id: data_scope
    attributes:
      label: 数据影响范围
      options:
        - 仅当前浏览器
        - 共享配置或同步
        - 后端账号或管理数据
        - 部署或发布
        - 不涉及数据
        - 尚不确定
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 方案不依赖新增网站访问权限。
          required: true
        - label: 方案不会要求公开或提交任何凭据。
          required: true
